[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quran-etl"
version = "0.2.0"
description = "ETL pipeline that downloads Tanzil.net Quran data and emits LLM-friendly, analytics-optimized JSON."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "quran-etl" }]
keywords = ["quran", "etl", "tanzil", "llm", "json"]
dependencies = [
    "requests>=2.32",
    "PyYAML>=6.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
reports = [
    "qmd2word @ git+https://github.com/ezAldinWaez/qmd2word.git@v0.3.1",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "jsonschema>=4.23",
]

[project.scripts]
quran-etl = "quran_etl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
